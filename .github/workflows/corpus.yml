# The corpus tier needs the retail game data, which cannot live on a hosted runner.
# This job runs on a self-hosted runner labelled `quake-corpus` whose QTS_TEST_CORPUS
# repository variable names the assembled data directory (q1/, q2/, q3a/).
name: corpus

on:
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus:
    runs-on: [self-hosted, quake-corpus]
    timeout-minutes: 240
    env:
      QTS_TEST_CORPUS: ${{ vars.QTS_TEST_CORPUS }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test:corpus
